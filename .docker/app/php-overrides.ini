[PHP]
expose_php = Off
memory_limit = 64M
; Defense in depth for CVE-2026-109619 (PHP2Shell); PHP 8.5.12+ is the real fix
fatal_error_backtraces = 0

[Session]
; Defense in depth for CVE-2026-109619 (PHP2Shell); Laravel doesn't use native upload progress
session.upload_progress.enabled = 0
session.use_strict_mode = 1
session.cookie_secure = 1
session.name = danksid

[opcache]
opcache.enable = 1
opcache.revalidate_freq = 60
opcache.save_comments = 0
